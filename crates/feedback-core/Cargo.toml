[package]
name = "feedback-core"
version = "0.1.0"
edition = "2021"
description = "ReflexWork feedback rules for the kernel worker (plan 008 / plan 016): 👎 reasons, the entries-to-fix queue, before/after a fix"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.118"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
