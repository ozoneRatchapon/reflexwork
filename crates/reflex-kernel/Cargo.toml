[package]
name = "reflex-kernel"
version = "0.1.0"
edition = "2021"
description = "ReflexWork — Modelless Reflex Engine: policy routing, sigmoid gating, BLAKE3 attestation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reflexwork/reflexwork"

[[bin]]
name = "reflex-agent"
path = "src/main.rs"

[lib]
name = "reflex_kernel"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []
wasm = ["wasm-bindgen", "web-sys", "js-sys"]
metrics = ["prometheus"]

[dependencies]
# Core
blake3            = { version = "1.5.4", features = ["std"] }
bincode           = { version = "1.3.3" }
serde             = { version = "1.0.210", features = ["derive"] }
serde_json        = { version = "1.0.128" }
uuid              = { version = "1.10.0", features = ["v4", "serde"] }
thiserror         = { version = "1.0.64" }
anyhow            = { version = "1.0.89" }

# Async runtime
tokio             = { version = "1.40.0", features = ["full"] }

# Config
toml              = { version = "0.8.19" }
hex               = { version = "0.4.3" }

# Logging
tracing           = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Solana client (for submitting Anchor transactions)
solana-sdk        = { version = "1.18.26" }
solana-client     = { version = "1.18.26" }
anchor-client     = { version = "0.30.1" }

# MCP client (JSON-RPC over stdio)
tokio-process     = { version = "1.0.0", package = "tokio", features = ["process"] }
jsonrpc-core      = { version = "18.0.0" }

# Optional: Wasm target bindings
wasm-bindgen      = { version = "0.2.93", optional = true }
web-sys           = { version = "0.3.70", optional = true }
js-sys            = { version = "0.3.70", optional = true }

# Optional: metrics
prometheus        = { version = "0.13.4", optional = true }

[dev-dependencies]
tokio-test        = { version = "0.4.4" }
criterion         = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "policy_routing"
harness = false

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = "symbols"
