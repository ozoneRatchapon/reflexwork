[package]
name = "reflex-kernel"
version = "0.1.0"
edition = "2021"
description = "ReflexWork — Modelless Reflex Engine: policy routing, sigmoid gating, BLAKE3 attestation"
license = "MIT OR Apache-2.0"

[[bin]]
name = "reflex-agent"
path = "src/main.rs"

[[bin]]
name = "reflex-serve"
path = "src/serve.rs"

[lib]
name = "reflex_kernel"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []

[dependencies]
# Core
blake3            = { version = "1.5.4", features = ["std"] }
bincode           = { version = "1.3.3" }
serde             = { version = "1.0.210", features = ["derive"] }
serde_json        = { version = "1.0.128" }
uuid              = { version = "1.10.0", features = ["v4", "serde"] }
thiserror         = { version = "2.0.3" }
anyhow            = { version = "1.0.89" }
hex               = { version = "0.4.3" }

# Async runtime
tokio             = { version = "1.40.0", features = ["full"] }

# HTTP service (REST API wrapping the kernel)
axum              = { version = "0.7.9" }
tower             = { version = "0.5.1" }
tower-http        = { version = "0.6.2", features = ["cors", "trace"] }

# Config
toml              = { version = "0.8.19" }

# Logging
tracing           = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Solana 3.x granular crates
solana-rpc-client        = { version = "3.0.14" }
solana-keypair           = { version = "3.0.1" }
solana-pubkey            = { version = "3.0.0" }
solana-signature         = { version = "3.3.0" }
solana-signer            = { version = "3.0.0" }
solana-commitment-config = { version = "3.1.1" }
solana-system-interface  = { version = "2.0.0" }
solana-instruction       = { version = "3.5.1" }

# Anchor client (git — async feature for tokio compatibility)
anchor-client = { git = "https://github.com/otter-sec/anchor", tag = "v1.2.0", features = ["async"] }
anchor-lang   = { git = "https://github.com/otter-sec/anchor", tag = "v1.2.0" }

# MCP client (JSON-RPC over stdio)
jsonrpc-core = { version = "18.0.0" }

# Misc utilities
shellexpand  = { version = "3.1.0" }

[dev-dependencies]
tokio-test  = { version = "0.4.4" }
criterion   = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "policy_routing"
harness = false

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = "symbols"
