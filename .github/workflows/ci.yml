name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # Rust port of the answer logic must match the frozen JS outputs (benchmark/golden, .plans/002).
  rust-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: reflex-wasm tests (golden contract)
        run: cargo test -p reflex-wasm   # Cargo.lock is not committed (.gitignore), so --locked is not possible

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # Node 20 is end-of-life (2026-04); tests/chat_e2e.test.mjs needs the global WebSocket (Node >= 22)

      - name: Unit tests (learning-loop pure logic)
        run: node tests/learning_loop.test.mjs

      - name: KB search recall floor (self-contained regression gate)
        run: node tests/kb_search_floor.test.mjs

      - name: Syntax-check Workers + shared modules
        run: |
          set -e
          for f in \
            integrations/kernel-worker/worker.mjs \
            integrations/llm-proxy/worker.mjs \
            integrations/llm-proxy/local-llm-proxy.mjs \
            integrations/line-worker/worker.mjs \
            integrations/_shared/answer_points.mjs \
            integrations/_shared/rethink.mjs \
            integrations/_shared/intake.mjs \
            integrations/_shared/team-adapter.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Build knowledge index (approved-only, publish-safe)
        run: python3 submissions/build_knowledge_index.py

      - name: KB answer quality (no empty / title-only answers)
        run: node tests/kb_answers.test.mjs

      - name: KB year/semester scope guard
        run: node tests/kb_scope.test.mjs

      - name: KB versioning (supersedes / valid_from / valid_to)
        run: node tests/kb_versioning.test.mjs

      - name: KB recall eval on the built index
        run: node tests/kb_search.test.mjs

      - name: Programme path (catalogue integrity, phrasings, no stolen KB questions, XSS)
        run: node tests/programme_resolve.test.mjs

      - name: Clickable links in answers (escaping, allowlist, text preserved)
        run: node tests/linkify.test.mjs

      - name: Chat robustness (sloppy typing, never a dead end)
        run: node tests/chat_robust.test.mjs

      - name: LLM proxy always answers within its budget and says why a backend failed
        run: node tests/llm_proxy.test.mjs

      - name: The on-page meter is a count, and inline handlers can reach their functions
        run: |
          set -e
          node tests/ratio_meter.test.mjs
          node tests/inline_handlers.test.mjs
          node tests/slides_claims.test.mjs
          node tests/feedback_votes.test.mjs
          node tests/wasm_lockstep.test.mjs

      - name: Every test file (a glob, so a new test can never be left out of CI)
        run: |
          set -e
          for t in tests/*.test.mjs; do echo "== $t"; node "$t"; done

      - name: Benchmarks still run (baseline comparison, programme names) - smoke, no thresholds
        run: |
          set -e
          node benchmark/compare/compare_retrievers.mjs > /dev/null
          node benchmark/compare/programme_names.mjs > /dev/null
