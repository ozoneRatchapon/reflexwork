name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # Rust port of the answer logic must match the frozen JS outputs (benchmark/golden, .plans/002).
  rust-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the published manual index (the route contract is recorded against it)
        run: python3 -I submissions/build_knowledge_index.py
      - name: reflex-wasm tests (golden contract)
        run: cargo test -p reflex-wasm   # Cargo.lock is not committed (.gitignore), so --locked is not possible
      - name: Pages CSP is current (one SHA-256 per inline script; a stale hash stops that script on production)
        run: cargo test -p pages-csp
      - name: Feedback rules (kernel worker wasm) and offline benches (certified bound, retention gate)
        run: cargo test -p feedback-core -p reflex-bench -p pii-mask -p pack-tools   # pack-tools: owner review page + its git-apply patch (plan 019 4.1)
      - name: Knowledge expiry report (warns on entries past valid_to or ending within 7 days; never fails the run, plan 019 4.2)
        run: cargo run -q -p pack-tools --bin pack-expiry -- --github packs/music-college examples/library-demo submissions/ui/knowledge-public
      - name: Knowledge lint (competing titles, empty keyword lines, answer dates after valid_to; warnings only, plan 019 4.4)
        run: cargo run -q -p pack-tools --bin pack-lint -- --github packs/music-college examples/library-demo submissions/ui/knowledge-public

  # Plan 019 item 6.1: a second organisation's site is built from a pack and driven in a real browser (Chrome on the runner).
  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # adoption_smoke drives Chrome over the global WebSocket (Node >= 22)
      - name: Allow Chrome's sandbox (Ubuntu 24.04 AppArmor blocks unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pack builds (library demo; College of Music draft with its review page, lint and 29 answers)
        run: |
          node tests/agency_pack.test.mjs
          node tests/music_pack.test.mjs
      - name: LINE on each pack (pack-line-kb manual + agency voice; LINE views name only the pack's entries, never the Graduate School, plan 019 6.2)
        run: node tests/line_pack.test.mjs
      - name: Adopted sites in headless Chrome (own words, own answers, nothing of the Graduate School, no script errors)
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          node scripts/new_agency.mjs examples/library-demo "$RUNNER_TEMP/library"
          node scripts/adoption_smoke.mjs "$RUNNER_TEMP/library"
          node scripts/new_agency.mjs packs/music-college "$RUNNER_TEMP/music" --draft
          node scripts/adoption_smoke.mjs "$RUNNER_TEMP/music"
      - name: Per-pack route goldens (pack-golden in Rust on each built site, then the shipped wasm on the same files, plan 019 6.3)
        run: |
          cargo run -q -p pack-tools --bin pack-golden -- examples/library-demo "$RUNNER_TEMP/library" benchmark/golden/library-demo/route.json
          cargo run -q -p pack-tools --bin pack-golden -- packs/music-college "$RUNNER_TEMP/music" benchmark/golden/college-of-music/route.json
          node tests/pack_golden.test.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # Node 20 is end-of-life (2026-04); tests/chat_e2e.test.mjs needs the global WebSocket (Node >= 22)

      - name: Unit tests (learning-loop pure logic)
        run: node tests/learning_loop.test.mjs

      - name: KB search recall floor (self-contained regression gate)
        run: node tests/kb_search_floor.test.mjs

      - name: Syntax-check Workers + shared modules
        run: |
          set -e
          for f in \
            integrations/kernel-worker/worker.mjs \
            integrations/llm-proxy/worker.mjs \
            integrations/llm-proxy/local-llm-proxy.mjs \
            integrations/line-worker/worker.mjs \
            integrations/line-worker/line_core.mjs \
            integrations/line-worker/app.mjs \
            integrations/_shared/answer_points.mjs \
            integrations/line-worker/views.mjs \
            integrations/_shared/intake.mjs \
            integrations/_shared/team-adapter.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Build knowledge index (approved-only, publish-safe)
        run: python3 submissions/build_knowledge_index.py

      - name: KB answer quality (no empty / title-only answers)
        run: node tests/kb_answers.test.mjs

      - name: KB year/semester scope guard
        run: node tests/kb_scope.test.mjs

      - name: KB versioning (supersedes / valid_from / valid_to)
        run: node tests/kb_versioning.test.mjs

      - name: Tuition finder only for tuition questions (not exam / service fees)
        run: node tests/tuition_scope.test.mjs

      - name: Vote bounds (Best-Belief) and the entries-to-fix order
        run: node tests/vote_bounds.test.mjs

      - name: Answer-type note (asked value kind missing from the entry)
        run: node tests/answer_type.test.mjs

      - name: Answer receipt (wasm hash == independent JS BLAKE3, covers the whole manual)
        run: node tests/receipt.test.mjs

      - name: Route contract (each branch of the chat's decision order, sampled)
        run: node tests/route_golden.test.mjs
      - name: Route contract on the shipped wasm (all single questions, no browser, minimum count)
        run: node benchmark/golden/route_rust_check.mjs

      - name: KB recall eval on the built index
        run: node tests/kb_search.test.mjs

      - name: Programme path (catalogue integrity, phrasings, no stolen KB questions, XSS)
        run: node tests/programme_resolve.test.mjs

      - name: Clickable links in answers (escaping, allowlist, text preserved)
        run: node tests/linkify.test.mjs

      - name: Chat robustness (sloppy typing, never a dead end)
        run: node tests/chat_robust.test.mjs

      - name: LLM proxy always answers within its budget and says why a backend failed
        run: node tests/llm_proxy.test.mjs

      - name: The on-page meter is a count, and inline handlers can reach their functions
        run: |
          set -e
          node tests/ratio_meter.test.mjs
          node tests/inline_handlers.test.mjs
          node tests/slides_claims.test.mjs
          node tests/feedback_votes.test.mjs
          node tests/kb_gate_floor.test.mjs

      - name: Every test file (a glob, so a new test can never be left out of CI)
        run: |
          set -e
          for t in tests/*.test.mjs; do echo "== $t"; node "$t"; done

      - name: Benchmarks still run (baseline comparison, programme names) - smoke, no thresholds
        run: |
          set -e
          node benchmark/compare/compare_retrievers.mjs > /dev/null
          node benchmark/compare/programme_names.mjs > /dev/null
