name = "reflexwork-kernel"
main = "worker.mjs"
compatibility_date = "2026-01-01"

# D1 binding — create the DB first, then paste its id here:
#   npx wrangler d1 create reflexwork
# then fill database_id below.
[[d1_databases]]
binding = "DB"
database_name = "reflexwork"
database_id = "a10fb432-55fe-4e07-8f93-d783ecb5adde"

# Service binding to the LLM proxy so /kb-autodraft can call it worker-to-worker
# (a plain public workers.dev fetch from one Worker to another on the same
# account is routed to 404 at the edge — a binding is the supported path).
[[services]]
binding = "LLM_PROXY_SVC"
service = "reflexwork-llm-proxy"

# Daily auto-draft: 02:00 UTC (09:00 เวลาไทย) — drafts KB candidates for the
# top unanswered gaps so the backlog shrinks on its own; staff just approve.
[triggers]
crons = ["0 2 * * *"]

