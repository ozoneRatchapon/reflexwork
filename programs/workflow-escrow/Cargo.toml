[package]
name = "workflow-escrow"
version = "0.1.0"
edition = "2021"
description = "ReflexWork — Solana Anchor escrow + BLAKE3 proof commitment program"

[lib]
crate-type = ["cdylib", "lib"]
name = "workflow_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor", tag = "v1.2.0", features = ["init-if-needed"] }

[dev-dependencies]
anchor-client = { git = "https://github.com/otter-sec/anchor", tag = "v1.2.0" }
