[package]
name = "workflow-escrow"
version = "0.1.0"
edition = "2021"
description = "ReflexWork — Solana Anchor escrow + BLAKE3 proof verification program"

[lib]
crate-type = ["cdylib", "lib"]
name = "workflow_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }

[dev-dependencies]
anchor-client = "0.30.1"
